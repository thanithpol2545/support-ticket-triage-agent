[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage-agent"
version = "0.1.0"
description = "Auditable GPT-powered customer support ticket triage with read-only tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<4", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
triage-agent = "triage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage_agent = ["data/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
